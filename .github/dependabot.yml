# Dependabot (gratuito): revisa las dependencias una vez por semana y abre Pull Requests.
#
# Moderado a propósito:
# - Solo actualizaciones menores y de parche agrupadas en UN PR por ecosistema (no 30 PR sueltos).
# - Las versiones MAYORES no se proponen solas (cambian APIs y requieren una tarea con pruebas
#   propias, como se hizo con Zod 4 y React Router 7). Las alertas de SEGURIDAD sí llegan siempre,
#   incluso si requieren una versión mayor (las gestiona "Dependabot security updates").
# - Ningún PR se mezcla automáticamente: cada uno pasa por el CI y lo revisa una persona.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    open-pull-requests-limit: 3
    labels: ["dependencias"]
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # En versiones 0.x, pasar de 0.4 a 0.5 es un cambio incompatible aunque Dependabot lo trate
      # como "menor": eslint-plugin-react-refresh 0.5 exige ESLint 9 o 10 y el frontend usa ESLint 8.
      # Con ESLint 8, npm instala un ESLint 10 aparte y el lint se cae (visto en el PR #7).
      # QUITAR esta excepcion cuando se migre a ESLint 9 (configuracion "flat"), en una tarea propia.
      - dependency-name: "eslint-plugin-react-refresh"
        versions: [">=0.5.0"]
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["dependencias"]
    commit-message:
      prefix: "ci"
    groups:
      acciones:
        patterns: ["*"]
