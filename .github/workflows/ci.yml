name: CI

# Verifica en cada Pull Request (y en cada push a main) que el proyecto pase lint, pruebas y build
# antes de integrar. Asi un cambio que rompe la compilacion o una prueba no llega a main ni a Render.

on:
  push:
    branches: [main]
  pull_request:

# Si se empuja dos veces seguidas a la misma rama, cancela la corrida anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest

    # Valores ficticios solo para que la validacion de variables (config/env.ts) y "prisma generate"
    # no fallen en el runner. NO son secretos reales: aqui no hay base de datos ni despliegue, solo se
    # compila y se corren las pruebas (que usan una base simulada). Los secretos reales viven en Render.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      JWT_SECRET: clave-ficticia-de-integracion-continua-32chars
      QR_TOKEN_SECRET: otra-clave-ficticia-de-integracion-32chars

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npm run prisma:generate

      - name: Lint (frontend)
        run: npm run lint

      - name: Pruebas (backend)
        run: npm run test:backend

      - name: Build (frontend + backend)
        run: npm run build
