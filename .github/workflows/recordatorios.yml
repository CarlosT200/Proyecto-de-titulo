# Cada hora le pide a HabitaSmart que envie los recordatorios automaticos (gasto comun por vencer o
# vencido y encomiendas sin retirar). Hace falta porque en el plan gratis de Render el servidor se
# duerme sin visitas y su revision interna no corre.
#
# Para activarla (una sola vez): en GitHub > Settings > Secrets and variables > Actions, crear
#   HABITASMART_URL = https://habitasmart.onrender.com
#   TAREAS_TOKEN    = la misma clave que la variable TAREAS_TOKEN del servicio en Render
# Sin esos secretos, la tarea no hace nada (no falla).
name: Recordatorios

on:
  schedule:
    # Solo en horas utiles de Chile (9:00 a 21:00; fuera de ese horario el servidor no envia nada y
    # despertarlo seria gastar minutos en vano). Hora de verano de Chile = UTC-3.
    - cron: "5 12-23,0,1 * * *"
  workflow_dispatch:

jobs:
  recordatorios:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      URL: ${{ secrets.HABITASMART_URL }}
      TOKEN: ${{ secrets.TAREAS_TOKEN }}
    steps:
      - name: Pedir el envio de recordatorios
        if: ${{ env.URL != '' && env.TOKEN != '' }}
        run: |
          URL="${URL%/}"
          # El plan gratis de Render duerme el servidor sin visitas y despertarlo puede tardar mas de
          # un minuto: primero se le toca la puerta y se espera a que responda.
          despierto=0
          for intento in 1 2 3 4 5 6; do
            if curl -fsS --max-time 75 "$URL/health" > /dev/null; then despierto=1; break; fi
            echo "El servidor aun no responde (intento $intento de 6)"
            sleep 10
          done
          if [ "$despierto" -ne 1 ]; then echo "El servidor no desperto a tiempo"; exit 1; fi
          echo "Largo de la clave guardada en GitHub: ${#TOKEN} caracteres (deben ser 48)"
          codigo=$(curl -sS -o respuesta.txt -w "%{http_code}" -X POST "$URL/api/tareas/recordatorios" \
            -H "x-tarea-token: $TOKEN" --max-time 60 --retry 2 --retry-delay 15 --retry-all-errors || true)
          echo "Respuesta del servidor: HTTP $codigo"
          cat respuesta.txt; echo
          case "$codigo" in
            2*) ;;
            401) echo "La clave TAREAS_TOKEN de GitHub no coincide con la de Render"; exit 1 ;;
            404) echo "El servidor no tiene TAREAS_TOKEN configurada (o la URL esta mal)"; exit 1 ;;
            *) exit 1 ;;
          esac
