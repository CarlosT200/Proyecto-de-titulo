services:
  - type: web
    name: habitasmart
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: habitasmart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: QR_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        value: https://habitasmart.onrender.com
      # Botones de cuentas de demostracion en el login. Oculto por defecto en produccion; poner
      # "true" en el dashboard solo para una demostracion (sync: false = el dashboard manda).
      - key: MOSTRAR_CUENTAS_DEMO
        sync: false
      # Web Push (notificaciones del sistema, incluida la alerta SOS, aunque
      # la app este cerrada). No se pueden generar con generateValue: true
      # (necesitan ser un par de claves EC validas, no un string random) --
      # hay que pegarlas a mano en el dashboard de Render despues de crear el
      # servicio. Generarlas con: node -e "console.log(require('web-push').generateVAPIDKeys())"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:torocarlos029@gmail.com"
      # Recordatorios cada hora con GitHub Actions (opcional). Pegar aqui la misma clave que el secreto
      # TAREAS_TOKEN del repositorio (ver .github/workflows/recordatorios.yml).
      - key: TAREAS_TOKEN
        sync: false

databases:
  - name: habitasmart-db
    plan: free
    databaseName: habitasmart
    user: habitasmart
